name: Update

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Compare with upstream
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest non-draft release, prereleases included: upstream ships betas only so far.
          tag=$(gh api repos/Flow-Tube/Flow-Desktop/releases -q '[.[] | select(.draft | not)][0].tag_name')
          latest=${tag#v}
          current=$(nix eval --raw .#default.version)
          echo "current=$current latest=$latest"
          [[ $latest =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo "unexpected tag: $tag"; exit 1; }
          if [ "$latest" != "$current" ]; then
            echo "current=$current" >> "$GITHUB_OUTPUT"
            echo "version=$latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: jlumbroso/free-disk-space@v1.3.1
        if: steps.check.outputs.version
        with:
          tool-cache: true

      - name: Bump version and hashes
        if: steps.check.outputs.version
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: nix run nixpkgs#nix-update -- --flake flow-desktop --version "$VERSION"

      # PRs opened with GITHUB_TOKEN do not trigger CI, so verify here before opening one.
      - name: Build and smoke-test
        if: steps.check.outputs.version
        run: nix build -L .#default && nix flake check -L

      - uses: peter-evans/create-pull-request@v8
        if: steps.check.outputs.version
        with:
          branch: update/flow-desktop
          delete-branch: true
          commit-message: "flow-desktop: ${{ steps.check.outputs.current }} -> ${{ steps.check.outputs.version }}"
          title: "flow-desktop: ${{ steps.check.outputs.current }} -> ${{ steps.check.outputs.version }}"
          body: |
            Upstream release: https://github.com/Flow-Tube/Flow-Desktop/releases/tag/v${{ steps.check.outputs.version }}

            Opened by the daily Update workflow. The package already built and passed the
            Xvfb smoke test on x86_64 in that run. CI does not start on its own for bot PRs;
            close and reopen this PR to run the full matrix (including aarch64).
